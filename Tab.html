<html>
    <head> 
        <meta charset="UTF-8">
        <title>My Website</title>
        <link rel="stylesheet" href="tab.css">
    </head>
    <body>
        <div class="box">
            <div class="tab">
                <button class="tablinks" onclick="openCity(event, 'First')">First Tab</button>
                <button class="tablinks" onclick="openCity(event, 'Second')">Second Tab</button>
                <button class="tablinks" onclick="openCity(event, 'Third')">Third Tab</button>
            </div>

            <div id="First" class="tabcontent">
                <h3>London</h3>
                <p>London is the capital city of England.</p>
            </div>

            <div id="Second" class="tabcontent">
                <h3>Paris</h3>
                <p>Paris is the capital of France.</p>
            </div>

            <div id="Third" class="tabcontent">
                <h3>Tokyo</h3>
                <p>Tokyo is the capital of Japan.</p>
            </div>
        </div>
        <div class="cookie">
            <img src="https://flaticon.com" alt="Cookie" class="cookie-img">
            <button type="button" class="btn-cancel" onclick="closeCookie()">X</button>     
            <p>We use Cookies to </br> improve your user </br> experience.</p>
            <button type="button" class="btn-accept" onclick="acceptCookie()">I like Cookies</button>
        </div>
        <script src="Tab.js"></script>
    </body>
</html>
